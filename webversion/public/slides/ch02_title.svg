<svg 
    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="1280" height="720" fill="url(#bg-gradient)"/>
    <!-- Decorative grid lines -->
    <g opacity="0.1" stroke="#94A3B8" stroke-width="1">
        <line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="360" x2="1280" y2="360"/>
        <line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/>
        <line x1="960" y1="0" x2="960" y2="720"/>
    </g>
    <!-- Decorative circles -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>
    <circle cx="1180" cy="620" r="120" fill="none" stroke="#10B981" stroke-width="2" opacity="0.3"/>
    <circle cx="200" cy="600" r="60" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.2"/>
    <!-- Course badge -->
    <rect x="80" y="50" width="200" height="40" rx="20" fill="#3B82F6" opacity="0.9"/>
    <text x="180" y="76" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">智慧银行实验教程</text>
    <!-- Chapter number -->
    <text x="120" y="280" font-family="SF Pro Display, sans-serif" font-size="120" fill="url(#accent-gradient)" font-weight="700" opacity="0.8">02</text>
    <!-- Chapter title -->
    <text x="120" y="380" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="42" fill="#F1F5F9" font-weight="700">环境搭建</text>
    <text x="120" y="440" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="28" fill="#94A3B8" font-weight="400">AI IDE配置与工具链部署</text>
    <!-- Decorative line -->
    <rect x="120" y="470" width="200" height="4" rx="2" fill="url(#accent-gradient)"/>
    <!-- Subtitle -->
    <text x="120" y="520" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#94A3B8">IDE安装配置 · MCP服务器接入 · Skill模板部署</text>
    <text x="120" y="550" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#94A3B8">Python环境配置 · 数据科学工具链</text>
    <!-- Key topics -->
    <g transform="translate(800, 300)">
        <!-- Topic 1 -->
        <rect x="0" y="0" width="380" height="60" rx="8" fill="#334155" opacity="0.8"/>
        <circle cx="30" cy="30" r="20" fill="#3B82F6" opacity="0.8"/>
        <text x="30" y="36" font-family="SF Pro Display, sans-serif" font-size="16" fill="white" text-anchor="middle">1</text>
        <text x="60" y="36" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">AI IDE生态全景与选型</text>
        <!-- Topic 2 -->
        <rect x="0" y="80" width="380" height="60" rx="8" fill="#334155" opacity="0.8"/>
        <circle cx="30" cy="110" r="20" fill="#10B981" opacity="0.8"/>
        <text x="30" y="116" font-family="SF Pro Display, sans-serif" font-size="16" fill="white" text-anchor="middle">2</text>
        <text x="60" y="116" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">Python数据科学环境配置</text>
        <!-- Topic 3 -->
        <rect x="0" y="160" width="380" height="60" rx="8" fill="#334155" opacity="0.8"/>
        <circle cx="30" cy="190" r="20" fill="#F59E0B" opacity="0.8"/>
        <text x="30" y="196" font-family="SF Pro Display, sans-serif" font-size="16" fill="white" text-anchor="middle">3</text>
        <text x="60" y="196" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">MCP服务器接入与配置</text>
        <!-- Topic 4 -->
        <rect x="0" y="240" width="380" height="60" rx="8" fill="#334155" opacity="0.8"/>
        <circle cx="30" cy="270" r="20" fill="#8B5CF6" opacity="0.8"/>
        <text x="30" y="276" font-family="SF Pro Display, sans-serif" font-size="16" fill="white" text-anchor="middle">4</text>
        <text x="60" y="276" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">Skill模板部署实战</text>
    </g>
    <!-- Bottom bar -->
    <rect x="0" y="680" width="1280" height="40" fill="#0F172A" opacity="0.8"/>
    <text x="40" y="706" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">SmartBank Agent · 智慧银行实验教程</text>
    <text x="1240" y="706" font-family="SF Pro Text, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">第 2 章 / 共 8 章</text>
    <!-- Decorative dots -->
    <g fill="#3B82F6" opacity="0.4">
        <circle cx="50" cy="350" r="3"/>
        <circle cx="50" cy="370" r="3"/>
        <circle cx="50" cy="390" r="3"/>
        <circle cx="50" cy="410" r="3"/>
        <circle cx="50" cy="430" r="3"/>
    </g>
    <!-- Speaker notes indicator -->
    <g transform="translate(1200, 680)">
        <rect x="0" y="0" width="60" height="30" rx="4" fill="#334155"/>
        <text x="30" y="20" font-family="SF Pro Text, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">🎤 Notes</text>
    </g>
</svg>