<svg 
    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#bg-gradient)"/>
    <g opacity="0.1" stroke="#94A3B8" stroke-width="1">
        <line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="360" x2="1280" y2="360"/>
        <line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/>
        <line x1="960" y1="0" x2="960" y2="720"/>
    </g>
    <rect x="80" y="50" width="200" height="40" rx="20" fill="#3B82F6" opacity="0.9"/>
    <text x="180" y="76" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">智慧银行实验教程</text>
    <text x="120" y="150" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="36" fill="#F1F5F9" font-weight="700">MCP Server开发实战</text>
    <text x="120" y="190" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="20" fill="#94A3B8">从零构建金融数据Server</text>
    <rect x="120" y="210" width="200" height="4" rx="2" fill="url(#accent-gradient)"/>
    <g transform="translate(120, 240)">
        <g transform="translate(0, 0)">
            <rect x="0" y="0" width="200" height="100" rx="8" fill="#334155" opacity="0.8"/>
            <text x="100" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">步骤1</text>
            <text x="100" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">环境准备</text>
            <text x="100" y="75" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Python/Node.js</text>
        </g>
        <g transform="translate(220, 0)">
            <rect x="0" y="0" width="200" height="100" rx="8" fill="#334155" opacity="0.8"/>
            <text x="100" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">步骤2</text>
            <text x="100" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Schema定义</text>
            <text x="100" y="75" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">工具参数声明</text>
        </g>
        <g transform="translate(440, 0)">
            <rect x="0" y="0" width="200" height="100" rx="8" fill="#334155" opacity="0.8"/>
            <text x="100" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">步骤3</text>
            <text x="100" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">业务逻辑</text>
            <text x="100" y="75" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">工具实现</text>
        </g>
        <g transform="translate(660, 0)">
            <rect x="0" y="0" width="200" height="100" rx="8" fill="#334155" opacity="0.8"/>
            <text x="100" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">步骤4</text>
            <text x="100" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Server注册</text>
            <text x="100" y="75" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">配置mcp.json</text>
        </g>
    </g>
    <g transform="translate(120, 360)">
        <rect x="0" y="0" width="1040" height="280" rx="12" fill="#0F172A" opacity="0.8"/>
        <text x="20" y="35" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="20" fill="#F1F5F9" font-weight="600">金融数据Server示例</text>
        <rect x="20" y="50" width="480" height="210" rx="8" fill="#1E293B"/>
        <text x="30" y="75" font-family="SF Mono, monospace" font-size="14" fill="#10B981"># 金融数据MCP Server</text>
        <text x="30" y="95" font-family="SF Mono, monospace" font-size="14" fill="#94A3B8">from mcp.server import Server</text>
        <text x="30" y="115" font-family="SF Mono, monospace" font-size="14" fill="#94A3B8">import tushare as ts</text>
        <text x="30" y="145" font-family="SF Mono, monospace" font-size="14" fill="#F1F5F9">server = Server("finance-data")</text>
        <text x="30" y="165" font-family="SF Mono, monospace" font-size="14" fill="#3B82F6">@server.tool("get_stock_data")</text>
        <text x="30" y="185" font-family="SF Mono, monospace" font-size="14" fill="#F1F5F9">async def get_stock(symbol: str):</text>
        <text x="30" y="205" font-family="SF Mono, monospace" font-size="14" fill="#F59E0B">    return ts.get_hist_data(symbol)</text>
        <g transform="translate(540, 50)">
            <rect x="0" y="0" width="480" height="210" rx="8" fill="#1E293B"/>
            <text x="20" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" font-weight="600">关键步骤说明</text>
            <text x="20" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#3B82F6">1. 导入MCP Server框架</text>
            <text x="20" y="75" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">   from mcp.server import Server</text>
            <text x="20" y="100" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981">2. 创建Server实例</text>
            <text x="20" y="120" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">   server = Server("finance-data")</text>
            <text x="20" y="145" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B">3. 定义工具函数</text>
            <text x="20" y="165" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">   @server.tool("tool_name")</text>
            <text x="20" y="185" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#8B5CF6">4. 注册到IDE配置</text>
            <text x="20" y="205" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">   mcp.json → finance-data</text>
        </g>
    </g>
    <rect x="0" y="680" width="1280" height="40" fill="#0F172A" opacity="0.8"/>
    <text x="40" y="706" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">SmartBank Agent · 智慧银行实验教程</text>
    <text x="1240" y="706" font-family="SF Pro Text, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">第 3 章 / 共 8 章</text>
    <g transform="translate(1200, 680)">
        <rect x="0" y="0" width="60" height="30" rx="4" fill="#334155"/>
        <text x="30" y="20" font-family="SF Pro Text, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">🎤 Notes</text>
    </g>
</svg>