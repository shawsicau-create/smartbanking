<svg 
    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#bg-gradient)"/>
    <g opacity="0.1" stroke="#94A3B8" stroke-width="1">
        <line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="360" x2="1280" y2="360"/>
        <line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/>
        <line x1="960" y1="0" x2="960" y2="720"/>
    </g>
    <rect x="80" y="50" width="200" height="40" rx="20" fill="#3B82F6" opacity="0.9"/>
    <text x="180" y="76" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">智慧银行实验教程</text>
    <text x="120" y="150" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="36" fill="#F1F5F9" font-weight="700">MCP三层架构</text>
    <text x="120" y="190" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="20" fill="#94A3B8">Model Context Protocol</text>
    <rect x="120" y="210" width="200" height="4" rx="2" fill="url(#accent-gradient)"/>
    <g transform="translate(120, 240)">
        <rect x="0" y="0" width="1040" height="120" rx="12" fill="#3B82F6" opacity="0.9"/>
        <text x="520" y="35" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">第1层：MCP Client</text>
        <text x="520" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#E0E7FF" text-anchor="middle">宿主 IDE（TRAE / Qoder / Cursor）</text>
        <text x="520" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#BFDBFE" text-anchor="middle">接收用户意图 → 决定调用哪个 MCP 工具</text>
        <rect x="20" y="20" width="60" height="30" rx="4" fill="#2563EB"/>
        <text x="50" y="40" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle">IDE</text>
    </g>
    <g transform="translate(120, 380)">
        <rect x="0" y="0" width="1040" height="120" rx="12" fill="#10B981" opacity="0.9"/>
        <text x="520" y="35" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">第2层：MCP Server</text>
        <text x="520" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#D1FAE5" text-anchor="middle">工具方进程（fetch / playwright / excel）</text>
        <text x="520" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#A7F3D0" text-anchor="middle">暴露 tools 列表 → 接收调用请求 → 返回结果</text>
        <rect x="20" y="20" width="80" height="30" rx="4" fill="#059669"/>
        <text x="60" y="40" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle">Server</text>
    </g>
    <g transform="translate(120, 520)">
        <rect x="0" y="0" width="1040" height="120" rx="12" fill="#F59E0B" opacity="0.9"/>
        <text x="520" y="35" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="600">第3层：真实工具 / 外部系统</text>
        <text x="520" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#FEF3C7" text-anchor="middle">浏览器 / Excel / Word / Stata / 数据库 / Web API</text>
        <text x="520" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#FDE68A" text-anchor="middle">实际执行操作（打开页面、写入文件、跑回归等）</text>
        <rect x="20" y="20" width="80" height="30" rx="4" fill="#D97706"/>
        <text x="60" y="40" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle">工具</text>
    </g>
    <g transform="translate(620, 240)">
        <rect x="0" y="0" width="200" height="120" rx="8" fill="#1E293B" opacity="0.8"/>
        <text x="100" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">工具发现</text>
        <text x="100" y="50" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">tools/list</text>
        <text x="100" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">意图路由</text>
        <text x="100" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">请求构造</text>
    </g>
    <g transform="translate(620, 380)">
        <rect x="0" y="0" width="200" height="120" rx="8" fill="#1E293B" opacity="0.8"/>
        <text x="100" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Schema声明</text>
        <text x="100" y="50" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">请求处理</text>
        <text x="100" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">工具调用</text>
        <text x="100" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">结果封装</text>
    </g>
    <g transform="translate(620, 520)">
        <rect x="0" y="0" width="200" height="120" rx="8" fill="#1E293B" opacity="0.8"/>
        <text x="100" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">浏览器引擎</text>
        <text x="100" y="50" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">办公软件</text>
        <text x="100" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">统计软件</text>
        <text x="100" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">数据库</text>
    </g>
    <g transform="translate(850, 240)">
        <rect x="0" y="0" width="310" height="120" rx="8" fill="#0F172A" opacity="0.8"/>
        <text x="155" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle" font-weight="600">核心设计思想</text>
        <text x="20" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#3B82F6">• 解耦：Client无需知道工具实现</text>
        <text x="20" y="75" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981">• 可插拔：新增Server只需配置</text>
        <text x="20" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B">• 标准化：统一JSON-RPC协议</text>
    </g>
    <rect x="0" y="680" width="1280" height="40" fill="#0F172A" opacity="0.8"/>
    <text x="40" y="706" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">SmartBank Agent · 智慧银行实验教程</text>
    <text x="1240" y="706" font-family="SF Pro Text, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">第 3 章 / 共 8 章</text>
    <g transform="translate(1200, 680)">
        <rect x="0" y="0" width="60" height="30" rx="4" fill="#334155"/>
        <text x="30" y="20" font-family="SF Pro Text, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">🎤 Notes</text>
    </g>
</svg>