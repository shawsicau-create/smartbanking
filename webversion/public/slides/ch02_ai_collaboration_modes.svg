<svg 
    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#bg-gradient)"/>
    <g opacity="0.1" stroke="#94A3B8" stroke-width="1">
        <line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="360" x2="1280" y2="360"/>
        <line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/>
        <line x1="960" y1="0" x2="960" y2="720"/>
    </g>
    <rect x="80" y="50" width="200" height="40" rx="20" fill="#3B82F6" opacity="0.9"/>
    <text x="180" y="76" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">智慧银行实验教程</text>
    <text x="120" y="150" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="36" fill="#F1F5F9" font-weight="700">AI协作四模式</text>
    <text x="120" y="190" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="20" fill="#94A3B8">IDE / Chat / Builder / SOLO</text>
    <rect x="120" y="210" width="200" height="4" rx="2" fill="url(#accent-gradient)"/>
    <g transform="translate(80, 240)">
        <rect x="0" y="0" width="280" height="180" rx="12" fill="#334155" opacity="0.8"/>
        <rect x="0" y="0" width="280" height="40" rx="12" fill="#3B82F6" opacity="0.9"/>
        <text x="140" y="28" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">IDE模式</text>
        <text x="20" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">传统编码+AI辅助补全</text>
        <text x="20" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• AI在光标位置提供补全建议</text>
        <text x="20" y="115" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• Tab接受，Esc忽略</text>
        <text x="20" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 适合日常编码</text>
        <rect x="20" y="150" width="240" height="25" rx="4" fill="#1E293B"/>
        <text x="140" y="168" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">风险等级：低</text>
    </g>
    <g transform="translate(400, 240)">
        <rect x="0" y="0" width="280" height="180" rx="12" fill="#334155" opacity="0.8"/>
        <rect x="0" y="0" width="280" height="40" rx="12" fill="#10B981" opacity="0.9"/>
        <text x="140" y="28" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">Chat模式</text>
        <text x="20" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">问答式交互</text>
        <text x="20" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• AI仅以文字回答</text>
        <text x="20" y="115" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 不直接修改代码文件</text>
        <text x="20" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 最安全的模式</text>
        <rect x="20" y="150" width="240" height="25" rx="4" fill="#1E293B"/>
        <text x="140" y="168" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">风险等级：最低</text>
    </g>
    <g transform="translate(720, 240)">
        <rect x="0" y="0" width="280" height="180" rx="12" fill="#334155" opacity="0.8"/>
        <rect x="0" y="0" width="280" height="40" rx="12" fill="#F59E0B" opacity="0.9"/>
        <text x="140" y="28" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">Builder模式</text>
        <text x="20" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">AI直接操作文件系统</text>
        <text x="20" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 可创建、修改、删除文件</text>
        <text x="20" y="115" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 在终端中执行命令</text>
        <text x="20" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 生产力最高</text>
        <rect x="20" y="150" width="240" height="25" rx="4" fill="#1E293B"/>
        <text x="140" y="168" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">风险等级：中</text>
    </g>
    <g transform="translate(1040, 240)">
        <rect x="0" y="0" width="200" height="180" rx="12" fill="#334155" opacity="0.8"/>
        <rect x="0" y="0" width="200" height="40" rx="12" fill="#8B5CF6" opacity="0.9"/>
        <text x="100" y="28" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">SOLO模式</text>
        <text x="20" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">全自主开发</text>
        <text x="20" y="95" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• AI拥有最大自主权</text>
        <text x="20" y="115" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 自行规划任务</text>
        <text x="20" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 适合快速原型</text>
        <rect x="20" y="150" width="160" height="25" rx="4" fill="#1E293B"/>
        <text x="100" y="168" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">风险等级：高</text>
    </g>
    <g transform="translate(80, 450)">
        <rect x="0" y="0" width="1160" height="200" rx="12" fill="#0F172A" opacity="0.8"/>
        <text x="20" y="35" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9" font-weight="600">提示工程基础（RTEII原则）</text>
        <g transform="translate(20, 50)">
            <text x="0" y="0" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#3B82F6">角色 (Role)</text>
            <text x="0" y="20" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">告诉AI"你是谁"</text>
        </g>
        <g transform="translate(250, 50)">
            <text x="0" y="0" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#10B981">任务 (Task)</text>
            <text x="0" y="20" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">描述要做什么</text>
        </g>
        <g transform="translate(480, 50)">
            <text x="0" y="0" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F59E0B">约束 (Constraint)</text>
            <text x="0" y="20" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">给出边界和格式</text>
        </g>
        <g transform="translate(710, 50)">
            <text x="0" y="0" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#8B5CF6">样例 (Example)</text>
            <text x="0" y="20" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">提供期望输出</text>
        </g>
        <g transform="translate(940, 50)">
            <text x="0" y="0" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#EC4899">迭代 (Iterate)</text>
            <text x="0" y="20" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">逐步优化修正</text>
        </g>
        <g transform="translate(20, 100)">
            <rect x="0" y="0" width="550" height="80" rx="8" fill="#1E293B"/>
            <text x="20" y="25" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">提示词优化示例：</text>
            <text x="20" y="45" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#EF4444">差：帮我做数据分析</text>
            <text x="20" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981">好：请基于data.xlsx用SARIMA预测未来30天消费趋势</text>
        </g>
        <g transform="translate(600, 100)">
            <rect x="0" y="0" width="560" height="80" rx="8" fill="#1E293B"/>
            <text x="20" y="25" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">AI协作闭环：</text>
            <text x="20" y="50" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">分析 → 生成 → 运行 → 调试</text>
            <text x="20" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">所有AI实验的基础工作模式</text>
        </g>
    </g>
    <rect x="0" y="680" width="1280" height="40" fill="#0F172A" opacity="0.8"/>
    <text x="40" y="706" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">SmartBank Agent · 智慧银行实验教程</text>
    <text x="1240" y="706" font-family="SF Pro Text, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">第 2 章 / 共 8 章</text>
    <g transform="translate(1200, 680)">
        <rect x="0" y="0" width="60" height="30" rx="4" fill="#334155"/>
        <text x="30" y="20" font-family="SF Pro Text, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">🎤 Notes</text>
    </g>
</svg>