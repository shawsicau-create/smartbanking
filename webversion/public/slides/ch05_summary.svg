        <text x="20" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9" font-weight="600">下一步</text>
        <text x="20" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#94A3B8">CLI工具为数据处理提供了命令行接口，下一章将深入金融数据分析——面板数据、时间序列与因果推断方法</text>
