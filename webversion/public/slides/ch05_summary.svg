            <text x="45" y="26" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9">CLI工具概述</text>
            <text x="45" y="48" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#94A3B8">命令行工具基础与使用方法</text>
        </g>
        <g transform="translate(0, 70)">
