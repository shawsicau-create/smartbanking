            <text x="95" y="40" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="36" fill="#3B82F6" text-anchor="middle" font-weight="700">B</text>
            <text x="95" y="70" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9" text-anchor="middle" font-weight="600">Brainstorm</text>
            <text x="95" y="100" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">业务分析师</text>
            <text x="95" y="125" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">AI as Analyst</text>
            <text x="95" y="160" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">→ 功能清单</text>
