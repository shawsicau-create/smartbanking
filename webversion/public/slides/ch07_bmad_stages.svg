    <text x="120" y="145" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="36" fill="#F1F5F9" font-weight="700">BMAD五阶段方法论</text>
    <rect x="120" y="170" width="200" height="4" rx="2" fill="url(#accent-gradient)"/>
