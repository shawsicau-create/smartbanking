            <text x="95" y="70" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9" text-anchor="middle" font-weight="600">Develop</text>
            <text x="95" y="100" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">开发者</text>
