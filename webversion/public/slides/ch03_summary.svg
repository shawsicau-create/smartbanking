            <text x="25" y="15" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">掌握JSON-RPC通信机制</text>
        </g>
        <g transform="translate(20, 150)">
            <circle cx="10" cy="10" r="8" fill="#F59E0B"/>
            <text x="25" y="15" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">能够开发自定义MCP Server</text>
        </g>
        <g transform="translate(20, 185)">
            <circle cx="10" cy="10" r="8" fill="#8B5CF6"/>
            <text x="25" y="15" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">配置IDE集成MCP工具</text>
        </g>
        <g transform="translate(20, 220)">
            <circle cx="10" cy="10" r="8" fill="#EC4899"/>
            <text x="25" y="15" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">构建智能客服原型系统</text>
