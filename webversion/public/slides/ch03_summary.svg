    <text x="120" y="150" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="42" fill="#F1F5F9" font-weight="700">本章小结</text>
    <rect x="120" y="180" width="200" height="4" rx="2" fill="url(#accent-gradient)"/>
    <text x="120" y="230" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="24" fill="#94A3B8">第3章：MCP协议</text>
    <g transform="translate(120, 270)">
        <g transform="translate(0, 0)">
