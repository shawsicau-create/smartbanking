            <text x="45" y="26" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9">银行业务接入</text>
            <text x="45" y="48" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#94A3B8">Excel/Word/浏览器自动化工具</text>
        </g>
