            <text x="45" y="26" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9">Server开发</text>
            <text x="45" y="48" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#94A3B8">从零构建金融数据MCP Server</text>
        </g>
        <g transform="translate(0, 210)">
