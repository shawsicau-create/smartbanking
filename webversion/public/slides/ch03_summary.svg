            <text x="45" y="26" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9">MCP三层架构</text>
            <text x="45" y="48" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#94A3B8">Client-Server-Tool三层解耦设计</text>
        </g>
        <g transform="translate(0, 70)">
            <circle cx="20" cy="20" r="15" fill="#10B981" opacity="0.8"/>
            <text x="20" y="26" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">2</text>
            <text x="45" y="26" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9">JSON-RPC通信</text>
            <text x="45" y="48" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#94A3B8">标准化的请求-响应协议</text>
        </g>
        <g transform="translate(0, 140)">
            <circle cx="20" cy="20" r="15" fill="#F59E0B" opacity="0.8"/>
