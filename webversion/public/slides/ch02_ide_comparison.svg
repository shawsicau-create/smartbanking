        <rect x="0" y="0" width="1120" height="50" fill="#3B82F6" opacity="0.9"/>
        <text x="100" y="32" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">对比维度</text>
        <text x="300" y="32" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">TRAE</text>
        <text x="500" y="32" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">Qoder</text>
        <text x="700" y="32" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">Cursor</text>
        <text x="900" y="32" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">CodeBuddy</text>
        <text x="1080" y="32" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">Windsurf</text>
        <!-- Row 1: 模型支持 -->
        <rect x="0" y="60" width="1120" height="50" fill="#334155" opacity="0.9"/>
        <text x="100" y="92" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">模型支持</text>
        <text x="300" y="92" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">豆包系列</text>
        <text x="500" y="92" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">通义+Claude</text>
        <text x="700" y="92" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">Claude+GPT</text>
        <text x="900" y="92" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">腾讯混元</text>
        <text x="1080" y="92" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">Claude+GPT</text>
        <!-- Row 2: MCP支持 -->
        <rect x="0" y="120" width="1120" height="50" fill="#1E293B" opacity="0.9"/>
        <text x="100" y="152" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">MCP支持</text>
        <text x="300" y="152" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">✓ 支持</text>
        <text x="500" y="152" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">✓ 支持</text>
        <text x="700" y="152" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">✓ 支持</text>
        <text x="900" y="152" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">✓ 支持</text>
        <text x="1080" y="152" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">✓ 支持</text>
