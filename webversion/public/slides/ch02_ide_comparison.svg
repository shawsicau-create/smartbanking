        <text x="100" y="332" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">中文支持</text>
        <text x="300" y="332" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">优秀</text>
        <text x="500" y="332" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">优秀</text>
        <text x="700" y="332" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">一般</text>
        <text x="900" y="332" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">优秀</text>
        <text x="1080" y="332" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">一般</text>
