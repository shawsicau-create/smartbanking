        <text x="40" y="22" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">第2章</text>
        <text x="100" y="25" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="24" fill="#F1F5F9" font-weight="600">主流AI IDE对比</text>
    </g>
    <!-- Comparison table -->
    <g transform="translate(80, 100)">
