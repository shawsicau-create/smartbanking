        <text x="100" y="212" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Skill支持</text>
        <text x="300" y="212" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">有限</text>
        <text x="500" y="212" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">丰富</text>
        <text x="700" y="212" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">有限</text>
        <text x="900" y="212" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">丰富(CNB)</text>
        <text x="1080" y="212" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">有限</text>
        <!-- Row 4: 定价 -->
        <rect x="0" y="240" width="1120" height="50" fill="#1E293B" opacity="0.9"/>
        <text x="100" y="272" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">定价</text>
        <text x="300" y="272" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">免费</text>
        <text x="500" y="272" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">付费</text>
        <text x="700" y="272" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">付费</text>
        <text x="900" y="272" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">试用后付费</text>
        <text x="1080" y="272" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">付费</text>
