        <text x="100" y="392" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">国内访问</text>
        <text x="300" y="392" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">直接</text>
        <text x="500" y="392" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">直接</text>
        <text x="700" y="392" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">需加速</text>
        <text x="900" y="392" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">直接</text>
        <text x="1080" y="392" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">需加速</text>
    </g>
    <!-- Recommendation box -->
    <g transform="translate(80, 510)">
        <rect x="0" y="0" width="1120" height="120" rx="12" fill="#334155" opacity="0.9" stroke="#3B82F6" stroke-width="2"/>
        <text x="40" y="35" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="#3B82F6" font-weight="600">选型建议</text>
        <g transform="translate(40, 55)">
            <circle cx="10" cy="10" r="6" fill="#10B981"/>
            <text x="25" y="15" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9">学生/初学者：推荐 
                <tspan fill="#3B82F6" font-weight="600">TRAE</tspan>（免费、中文友好、Builder模式零门槛）</text>
            <circle cx="10" cy="45" r="6" fill="#10B981"/>
            <text x="25" y="50" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9">研究者：推荐 
                <tspan fill="#3B82F6" font-weight="600">Qoder或TRAE</tspan>（Skill生态丰富，支持学术写作）</text>
        </g>
