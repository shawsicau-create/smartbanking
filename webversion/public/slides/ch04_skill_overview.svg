            <text x="20" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">数据驱动模型训练</text>
            <text x="20" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 黑箱决策问题</text>
            <text x="20" y="115" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 需大量标注数据</text>
            <text x="20" y="140" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 模式识别能力强</text>
        </g>
