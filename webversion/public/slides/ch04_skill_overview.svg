            <text x="105" y="25" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="#10B981" text-anchor="middle" font-weight="600">Skill体系</text>
            <text x="105" y="50" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">编码领域知识</text>
            <text x="105" y="72" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">指导AI执行任务</text>
            <text x="105" y="94" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">解决"怎么做"</text>
