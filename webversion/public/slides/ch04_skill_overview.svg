            <text x="70" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="white" text-anchor="middle">Requirements</text>
        </g>
        <g transform="translate(320, 130)">
            <rect x="0" y="0" width="140" height="50" rx="6" fill="#EF4444" opacity="0.8"/>
            <text x="70" y="30" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="white" text-anchor="middle">Best Practices</text>
        </g>
    </g>
