            <text x="20" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">Markdown知识编码</text>
            <text x="20" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981">• 人机协作知识</text>
