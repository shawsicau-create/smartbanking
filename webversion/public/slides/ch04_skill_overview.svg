            <text x="105" y="50" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">连接外部数据源</text>
            <text x="105" y="72" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9" text-anchor="middle">标准化工具接口</text>
            <text x="105" y="94" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">解决"能做什么"</text>
        </g>
