            <text x="20" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9">IF-THEN规则编码</text>
            <text x="20" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 知识获取瓶颈</text>
            <text x="20" y="115" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 规则维护成本高</text>
            <text x="20" y="140" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">• 可解释性强</text>
