            <text x="120" y="35" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="20" fill="#3B82F6" text-anchor="middle" font-weight="600">可行性</text>
            <text x="120" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">4周内可完成MVP</text>
            <text x="120" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">2-4人团队</text>
            <text x="120" y="120" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">课程工具可实现</text>
            <text x="120" y="145" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Feasibility</text>
