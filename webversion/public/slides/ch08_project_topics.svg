            <text x="120" y="35" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="20" fill="#10B981" text-anchor="middle" font-weight="600">创新性</text>
            <text x="120" y="65" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">技术新组合</text>
            <text x="120" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">业务新场景</text>
            <text x="120" y="120" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">跨界应用也是创新</text>
            <text x="120" y="145" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Novelty</text>
