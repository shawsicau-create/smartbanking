            <text x="0" y="44" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#10B981">★★★ 银行反欺诈交易检测系统</text>
            <text x="0" y="66" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#10B981">★★★ 智能贷款计算器与方案比较</text>
            <text x="0" y="88" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#10B981">★★★ 银行客户流失预警系统</text>
        </g>
        <g transform="translate(380, 65)">
