            <text x="0" y="22" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#10B981">★★★ 银行ESG评级分析工具</text>
            <text x="0" y="44" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#F59E0B">★★★★ 跨境汇款路径优化系统</text>
            <text x="0" y="66" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#F59E0B">★★★★ 银行知识图谱构建与问答</text>
            <text x="0" y="88" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#10B981">★★★ 中小银行数字化转型评估工具</text>
        </g>
        <g transform="translate(740, 65)">
            <text x="0" y="0" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#F59E0B">★★★★ 供应链金融平台原型</text>
            <text x="0" y="22" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="15" fill="#10B981">★★★ 银行合规检查自动化系统</text>
            <text x="0" y="55" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">★★ = 初学者（2人/2周）</text>
            <text x="0" y="77" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">★★★ = 有基础（3人/3周）</text>
