<svg 
    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="timeline-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="25%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="25%" style="stop-color:#10B981;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#10B981;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="75%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="75%" style="stop-color:#8B5CF6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="1280" height="720" fill="url(#bg-gradient)"/>
    <!-- Decorative grid lines -->
    <g opacity="0.1" stroke="#94A3B8" stroke-width="1">
        <line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="360" x2="1280" y2="360"/>
        <line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/>
        <line x1="960" y1="0" x2="960" y2="720"/>
    </g>
    <!-- Header -->
    <g transform="translate(80, 40)">
        <rect x="0" y="0" width="80" height="32" rx="16" fill="#3B82F6" opacity="0.9"/>
        <text x="40" y="22" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">第1章</text>
        <text x="100" y="25" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="24" fill="#F1F5F9" font-weight="600">金融科技发展四阶段</text>
    </g>
    <!-- Timeline -->
    <g transform="translate(80, 200)">
        <!-- Timeline bar -->
        <rect x="0" y="250" width="1120" height="8" rx="4" fill="url(#timeline-gradient)"/>
        <!-- Stage 1: 电子化 -->
        <g transform="translate(0, 0)">
            <!-- Stage marker -->
            <circle cx="0" cy="254" r="16" fill="#3B82F6"/>
            <circle cx="0" cy="254" r="8" fill="#1E293B"/>
            <!-- Content box -->
            <rect x="-250" y="0" width="500" height="200" rx="12" fill="#334155" opacity="0.9" stroke="#3B82F6" stroke-width="2"/>
            <!-- Stage number -->
            <text x="-230" y="40" font-family="SF Pro Display, sans-serif" font-size="48" fill="#3B82F6" font-weight="700">1</text>
            <!-- Stage title -->
            <text x="-170" y="40" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="20" fill="#F1F5F9" font-weight="600">电子化阶段</text>
            <!-- Period -->
            <rect x="-230" y="55" width="120" height="24" rx="12" fill="#3B82F6" opacity="0.8"/>
            <text x="-170" y="72" font-family="SF Pro Text, sans-serif" font-size="12" fill="white" text-anchor="middle">1960s—1990s</text>
            <!-- Description -->
            <text x="-230" y="110" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">以大型计算机和核心业务系统为标志</text>
            <text x="-230" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">从手工记账到电子化处理的跨越</text>
            <!-- Key technologies -->
            <text x="-230" y="170" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#F59E0B">代表技术：IBM大型机、MIDAS核心银行系统</text>
        </g>
        <!-- Stage 2: 网络化 -->
        <g transform="translate(280, 0)">
            <circle cx="0" cy="254" r="16" fill="#10B981"/>
            <circle cx="0" cy="254" r="8" fill="#1E293B"/>
            <rect x="-250" y="0" width="500" height="200" rx="12" fill="#334155" opacity="0.9" stroke="#10B981" stroke-width="2"/>
            <text x="-230" y="40" font-family="SF Pro Display, sans-serif" font-size="48" fill="#10B981" font-weight="700">2</text>
            <text x="-170" y="40" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="20" fill="#F1F5F9" font-weight="600">网络化阶段</text>
            <rect x="-230" y="55" width="120" height="24" rx="12" fill="#10B981" opacity="0.8"/>
            <text x="-170" y="72" font-family="SF Pro Text, sans-serif" font-size="12" fill="white" text-anchor="middle">1995—2010</text>
            <text x="-230" y="110" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">以互联网和在线银行为标志</text>
            <text x="-230" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">突破物理网点的时空限制</text>
            <text x="-230" y="170" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#F59E0B">代表技术：网上银行、电子支付、SWIFT网络</text>
        </g>
        <!-- Stage 3: 移动化 -->
        <g transform="translate(560, 0)">
            <circle cx="0" cy="254" r="16" fill="#F59E0B"/>
            <circle cx="0" cy="254" r="8" fill="#1E293B"/>
            <rect x="-250" y="0" width="500" height="200" rx="12" fill="#334155" opacity="0.9" stroke="#F59E0B" stroke-width="2"/>
            <text x="-230" y="40" font-family="SF Pro Display, sans-serif" font-size="48" fill="#F59E0B" font-weight="700">3</text>
            <text x="-170" y="40" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="20" fill="#F1F5F9" font-weight="600">移动化阶段</text>
            <rect x="-230" y="55" width="120" height="24" rx="12" fill="#F59E0B" opacity="0.8"/>
            <text x="-170" y="72" font-family="SF Pro Text, sans-serif" font-size="12" fill="white" text-anchor="middle">2010—2020</text>
            <text x="-230" y="110" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">以智能手机和移动支付为标志</text>
            <text x="-230" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">实现金融服务"随时随刻"触达</text>
            <text x="-230" y="170" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#F59E0B">代表技术：移动银行App、二维码支付、开放银行API</text>
        </g>
        <!-- Stage 4: 智能化 -->
        <g transform="translate(840, 0)">
            <circle cx="0" cy="254" r="16" fill="#8B5CF6"/>
            <circle cx="0" cy="254" r="8" fill="#1E293B"/>
            <rect x="-250" y="0" width="500" height="200" rx="12" fill="#334155" opacity="0.9" stroke="#8B5CF6" stroke-width="2"/>
            <text x="-230" y="40" font-family="SF Pro Display, sans-serif" font-size="48" fill="#8B5CF6" font-weight="700">4</text>
            <text x="-170" y="40" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="20" fill="#F1F5F9" font-weight="600">智能化阶段</text>
            <rect x="-230" y="55" width="120" height="24" rx="12" fill="#8B5CF6" opacity="0.8"/>
            <text x="-170" y="72" font-family="SF Pro Text, sans-serif" font-size="12" fill="white" text-anchor="middle">2020至今</text>
            <text x="-230" y="110" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">以大语言模型和智能体为标志</text>
            <text x="-230" y="135" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">从"辅助决策"到"自主决策"的质变</text>
            <text x="-230" y="170" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#F59E0B">代表技术：LLM、Agent、MCP协议、RPA+AI</text>
        </g>
    </g>
    <!-- Evolution arrow -->
    <g transform="translate(80, 480)">
        <text x="0" y="0" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="18" fill="#F1F5F9" font-weight="600">演进特征</text>
        <!-- Arrow -->
        <path d="M 0 40 L 1120 40 L 1100 30 M 1120 40 L 1100 50" stroke="#94A3B8" stroke-width="2" fill="none"/>
        <!-- Labels -->
        <text x="100" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#3B82F6" text-anchor="middle">效率提升</text>
        <text x="100" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">手工→电子</text>
        <text x="380" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">效率提升</text>
        <text x="380" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">网点→在线</text>
        <text x="660" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">效率提升</text>
        <text x="660" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">固定→移动</text>
        <text x="940" y="70" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#8B5CF6" text-anchor="middle">能力跃迁</text>
        <text x="940" y="90" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">辅助→自主</text>
    </g>
    <!-- Key insight box -->
    <g transform="translate(80, 580)">
        <rect x="0" y="0" width="1120" height="80" rx="12" fill="#334155" opacity="0.9"/>
        <text x="40" y="35" font-family="SF Pro Display, PingFang SC, sans-serif" font-size="16" fill="#F59E0B" font-weight="600">核心洞察</text>
        <text x="40" y="60" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#F1F5F9">前三个阶段的本质是"效率提升"——用更快的技术替代人工；第四个阶段的本质是"能力跃迁"——AI在认知维度上拓展了可能性边界</text>
    </g>
    <!-- Bottom bar -->
    <rect x="0" y="680" width="1280" height="40" fill="#0F172A" opacity="0.8"/>
    <text x="40" y="706" font-family="SF Pro Text, PingFang SC, sans-serif" font-size="14" fill="#94A3B8">SmartBank Agent · 智慧银行实验教程</text>
    <text x="1240" y="706" font-family="SF Pro Text, sans-serif" font-size="14" fill="#94A3B8" text-anchor="end">第 1 章 / 共 8 章</text>
    <!-- Speaker notes indicator -->
    <g transform="translate(1200, 680)">
        <rect x="0" y="0" width="60" height="30" rx="4" fill="#334155"/>
        <text x="30" y="20" font-family="SF Pro Text, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">🎤 Notes</text>
    </g>
</svg>