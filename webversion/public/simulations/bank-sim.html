<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>银行经营模拟器 - SmartBank Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            min-height: 100vh
        }

        .header {
            padding: 16px 24px;
            background: #111827;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .header h1 {
            font-size: 18px
        }

        .header a {
            color: #10b981;
            text-decoration: none;
            font-size: 13px
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px
        }

        .stat {
            background: #1a2332;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 14px;
            text-align: center
        }

        .stat .val {
            font-size: 22px;
            font-weight: 700;
            color: #10b981
        }

        .stat .lbl {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px
        }

        .ctrl {
            background: #1a2332;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px
        }

        .ctrl h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #10b981
        }

        .ctrl label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px
        }

        .ctrl input[type=range] {
            width: 100%;
            margin-bottom: 4px
        }

        .ctrl .range-val {
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 600
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #10b981;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px
        }

        .btn:hover {
            background: #059669
        }

        .btn:disabled {
            opacity: 0.4
        }

        .chart-area {
            background: #1a2332;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px
        }

        .chart-area h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #10b981
        }

        canvas {
            width: 100%;
            height: 200px
        }

        .log {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.8
        }

        .log p {
            border-bottom: 1px solid #1e293b;
            padding: 4px 0
        }

        .log .good {
            color: #10b981
        }

        .log .bad {
            color: #ef4444
        }

        .round-info {
            text-align: center;
            margin-bottom: 16px;
            font-size: 14px;
            color: #94a3b8
        }

        @media(max-width:640px) {
            .stats {
                grid-template-columns: repeat(2, 1fr)
            }

            .controls {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🏦 银行经营模拟器</h1><a href="/">返回课程</a>
    </div>
    <div class="container">
        <div class="round-info">回合：<span id="round">0</span>/12 | 评级：<span id="rating">-</span></div>
        <div class="stats">
            <div class="stat">
                <div class="val" id="s-capital">1000</div>
                <div class="lbl">资本金(亿)</div>
            </div>
            <div class="stat">
                <div class="val" id="s-deposit">5000</div>
                <div class="lbl">存款(亿)</div>
            </div>
            <div class="stat">
                <div class="val" id="s-loan">4000</div>
                <div class="lbl">贷款(亿)</div>
            </div>
            <div class="stat">
                <div class="val" id="s-npl">1.5</div>
                <div class="lbl">不良率(%)</div>
            </div>
        </div>
        <div class="controls">
            <div class="ctrl">
                <h3>📊 资产配置决策</h3>
                <label>贷款投放比例：<span id="v-loan" class="range-val">70</span>%</label>
                <input type="range" id="r-loan" min="30" max="90" value="70">
                <label>投资证券比例：<span id="v-invest" class="range-val">20</span>%</label>
                <input type="range" id="r-invest" min="5" max="50" value="20">
            </div>
            <div class="ctrl">
                <h3>⚙️ 风险管理决策</h3>
                <label>贷款利率：<span id="v-rate" class="range-val">5.0</span>%</label>
                <input type="range" id="r-rate" min="30" max="80" value="50">
                <label>拨备覆盖率：<span id="v-prov" class="range-val">150</span>%</label>
                <input type="range" id="r-prov" min="100" max="300" value="150">
            </div>
        </div>
        <button class="btn" id="next-round">执行下一轮经营 ▶</button>
        <div class="chart-area">
            <h3>📈 资本充足率趋势</h3><canvas id="chart"></canvas>
        </div>
        <div class="log" id="log"></div>
    </div>
    <script>
        let state = { round: 0, capital: 1000, deposit: 5000, loan: 4000, invest: 1000, npl: 1.5, capitalRatio: 12.5, profit: 0 };
        let history = [{ r: 0, cr: 12.5 }];
        const $ = id => document.getElementById(id);
        function fmt(n) { return n.toFixed(1) }
        function update() {
            $('round').textContent = state.round;
            $('s-capital').textContent = fmt(state.capital);
            $('s-deposit').textContent = fmt(state.deposit);
            $('s-loan').textContent = fmt(state.loan);
            $('s-npl').textContent = fmt(state.npl);
            const r = state.capitalRatio;
            $('rating').textContent = r >= 10 ? 'A' : r >= 8 ? 'B' : r >= 6 ? 'C' : 'D';
            $('rating').style.color = r >= 10 ? '#10b981' : r >= 8 ? '#3b82f6' : r >= 6 ? '#f59e0b' : '#ef4444';
            drawChart();
        }
        ['loans', 'invests', 'rates', 'provs'].forEach(k => { });
        $('r-loan').oninput = function () { $('v-loan').textContent = this.value };
        $('r-invest').oninput = function () { $('v-invest').textContent = this.value };
        $('r-rate').oninput = function () { $('v-rate').textContent = (this.value / 10).toFixed(1) };
        $('r-prov').oninput = function () { $('v-prov').textContent = this.value };

        $('next-round').onclick = function () {
            state.round++;
            const loanPct = +$('r-loan').value / 100;
            const investPct = +$('r-invest').value / 100;
            const rate = +$('r-rate').value / 10;
            const prov = +$('r-prov').value;
            const totalAsset = state.deposit + state.capital;
            const newLoan = totalAsset * loanPct;
            const newInvest = totalAsset * investPct;
            const loanInterest = newLoan * (rate / 100);
            const investReturn = newInvest * (0.03 + Math.random() * 0.02);
            const depositCost = state.deposit * 0.02;
            const baseNpl = 1.5 + (loanPct - 0.6) * 5 + (rate - 5) * 0.3;
            state.npl = Math.max(0.3, baseNpl + Math.random() * 1.5 - 0.5);
            const provision = newLoan * (state.npl / 100) * (prov / 100);
            state.profit = loanInterest + investReturn - depositCost - provision;
            state.capital += state.profit;
            state.loan = newLoan;
            state.invest = newInvest;
            state.deposit *= (1 + 0.02 + Math.random() * 0.01);
            state.capitalRatio = (state.capital / (newLoan * 0.5 + newInvest * 0.3)) * 100;
            history.push({ r: state.round, cr: state.capitalRatio });
            const log = $('log');
            const cls = state.profit > 0 ? 'good' : 'bad';
            log.innerHTML = `<p class="${cls}">回合${state.round}: 利息收入${fmt(loanInterest)}亿, 投资收益${fmt(investReturn)}亿, 拨备${fmt(provision)}亿, 利润${fmt(state.profit)}亿</p>` + log.innerHTML;
            if (state.capitalRatio < 8) log.innerHTML = `<p class="bad">⚠️ 资本充足率低于8%监管红线！</p>` + log.innerHTML;
            update();
        };

        function drawChart() {
            const c = $('chart'), ctx = c.getContext('2d');
            c.width = c.offsetWidth * 2; c.height = 400; ctx.scale(2, 2);
            const w = c.offsetWidth, h = 200;
            ctx.fillStyle = '#1a2332'; ctx.fillRect(0, 0, w, h);
            if (history.length < 2) return;
            const max = Math.max(...history.map(h => h.cr), 15);
            const min = Math.min(...history.map(h => h.cr), 5);
            const range = max - min || 1;
            ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.beginPath();
            history.forEach((d, i) => {
                const x = 20 + i * ((w - 40) / (history.length - 1));
                const y = h - 20 - ((d.cr - min) / range) * (h - 40);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            });
            ctx.stroke();
            ctx.strokeStyle = 'rgba(239,68,68,0.3)'; ctx.setLineDash([4, 4]); ctx.beginPath();
            const y8 = h - 20 - ((8 - min) / range) * (h - 40); ctx.moveTo(20, y8); ctx.lineTo(w - 20, y8); ctx.stroke();
            ctx.setLineDash([]); ctx.fillStyle = '#ef4444'; ctx.font = '10px sans-serif'; ctx.fillText('8%红线', w - 50, y8 - 4);
            ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
            history.forEach((d, i) => {
                if (i % 3 === 0 || i === history.length - 1) {
                    const x = 20 + i * ((w - 40) / (history.length - 1)); ctx.fillText('R' + d.r, x, h - 6);
                }
            });
        }
        update();
    </script>
</body>

</html>
